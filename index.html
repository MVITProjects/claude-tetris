<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Toggle light/dark theme">LIGHT MODE</button>
  <h1 class="game-title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> move</li>
            <li><kbd>↑</kbd> rotate</li>
            <li><kbd>↓</kbd> soft drop</li>
            <li><kbd>Space</kbd> hard drop</li>
            <li><kbd>P</kbd> pause</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Restart</button>
      </div>
    </div>
    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSED</p>
        <button type="button" id="pause-resume" class="menu-btn">Resume</button>
        <button type="button" id="pause-restart" class="menu-btn">Restart</button>
        <label class="menu-row" for="start-level">
          <span class="label">STARTING LEVEL</span>
          <select id="start-level"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option></select>
        </label>
        <button type="button" id="pause-controls-btn" class="menu-btn secondary" aria-expanded="false" aria-controls="pause-controls">Controls</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><kbd>←</kbd><kbd>→</kbd> move</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> rotate</li>
          <li><kbd>↓</kbd> soft drop</li>
          <li><kbd>Space</kbd> hard drop</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pause / resume</li>
        </ul>
        <p class="menu-hint">Starting level applies to the next game.</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
