<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Toggle light/dark theme">LIGHT MODE</button>
  <label class="skin-picker" for="skin-select">SKIN
    <select id="skin-select" aria-label="Visual skin">
      <option value="retro">Retro</option>
      <option value="neon">Neon</option>
      <option value="pastel">Pastel</option>
      <option value="pixel">Pixel art</option>
    </select>
  </label>
  <h1 class="game-title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> move</li>
            <li><kbd>↑</kbd> rotate</li>
            <li><kbd>↓</kbd> soft drop</li>
            <li><kbd>Space</kbd> hard drop</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pause</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>
        <div id="pause-menu" class="pause-menu hidden">
          <button id="resume-btn" type="button">Resume</button>
          <button id="controls-btn" type="button" aria-expanded="false">View controls</button>
          <ul id="controls-list" class="hidden">
            <li><kbd>←</kbd><kbd>→</kbd> move</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> rotate</li>
            <li><kbd>↓</kbd> soft drop</li>
            <li><kbd>Space</kbd> hard drop</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pause</li>
          </ul>
          <label class="level-select">
            <span class="label">STARTING LEVEL</span>
            <select id="start-level"></select>
          </label>
        </div>
        <form id="name-form" class="name-form hidden" autocomplete="off">
          <span id="name-prompt">NEW HIGH SCORE! ENTER YOUR NAME</span>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" placeholder="Name" aria-label="Player name" />
            <button id="name-save" type="submit">Save</button>
          </div>
        </form>
        <div class="leaderboard">
          <span class="label">TOP 5</span>
          <ol id="leaderboard"></ol>
          <p id="records"></p>
        </div>
        <button id="restart-btn">Start</button>
        <button id="reset-btn" type="button">Reset records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
