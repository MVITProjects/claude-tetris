<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Toggle light/dark theme">LIGHT MODE</button>
  <h1 class="game-title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> move</li>
            <li><kbd>↑</kbd> rotate</li>
            <li><kbd>↓</kbd> soft drop</li>
            <li><kbd>Space</kbd> hard drop</li>
            <li><kbd>P</kbd> pause</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Restart</button>

        <div id="pause-menu" class="pause-menu hidden">
          <div id="pause-main" class="menu-view">
            <button type="button" id="resume-btn" class="menu-btn">Resume</button>
            <button type="button" id="pause-restart-btn" class="menu-btn">Restart</button>
            <button type="button" id="controls-btn" class="menu-btn">View controls</button>
            <label class="level-select">
              <span class="label">STARTING LEVEL</span>
              <select id="start-level"></select>
            </label>
          </div>
          <div id="pause-controls" class="menu-view hidden">
            <ul class="controls-list">
              <li><span><kbd>←</kbd><kbd>→</kbd></span> move</li>
              <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotate</li>
              <li><span><kbd>↓</kbd></span> soft drop</li>
              <li><span><kbd>Space</kbd></span> hard drop</li>
              <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pause / resume</li>
            </ul>
            <button type="button" id="controls-back-btn" class="menu-btn">Back</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
